[main]
font = JetBrainsMono Nerd Font:weight=semibold:size=9
width = 60
lines = 6
horizontal-pad = 20
vertical-pad = 15
inner-pad = 8
line-height = 15
letter-spacing = 0.5
prompt = "❯ "
hide-prompt = yes
icons-enabled = no
dpi-aware = auto

[colors]
background = "#050505ff"
text = "#c9d1d9ff"
prompt = "#58a6ffff"
input = "#c9d1d9ff"
match = "#58a6ffff"
selection = "#58a6ffff"
selection-text = "#050505ff"
selection-match = "#050505ff"
border = "#58a6ffff"

[border]
width = 2
radius = 0
