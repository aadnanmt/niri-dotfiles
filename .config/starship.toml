# version: 1.0.0
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed cyan)"

format = """($nix_shell$container$fill$git_metrics\n)$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$character"""

right_format = "$all"

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[ ](bold bright-cyan)"
error_symbol = "[󰅙 ](bold red)"
vimcmd_symbol = "[󰇄 ](bold italic cyan)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'cyan italic'

[sudo]
format = "[󱚝 ]($style)"
style = "bold bright-cyan"
disabled = false

[username]
style_user = "bright-cyan bold italic"
style_root = "red bold italic"
format = "[󰀉 $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "󱂵 "
truncation_length = 3
truncation_symbol = "󰇘 "
read_only = " 󰌾"
use_os_path_sep = true
style = "bold cyan"
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_style = 'bold bright-cyan'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [󰊢](bold bright-cyan) '

[cmd_duration]
format = "[◄ $duration ](italic dimmed cyan)"

[jobs]
format = "[$symbol$number]($style) "
style = "cyan"
symbol = "[▶](bright-cyan italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold cyan)"
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed white"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold cyan)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed cyan"

[[battery.display]]
threshold = 70
style = "italic dimmed bright-cyan"

[git_branch]
symbol = "󰊢 "
style = "bold italic cyan"
format = "[$symbol$branch]($style) "
truncation_symbol = "󰇘 "
truncation_length = 11
ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
format = '([󰶣 $added]($added_style))([󰶡 $deleted]($deleted_style))'
added_style = 'italic dimmed cyan'
deleted_style = 'italic dimmed red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold cyan"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style)) "
conflicted = "󰯓 "
ahead = "󰶣 "
behind = "󰶡 "
diverged = "󰶣 󰶡 "
untracked = "󰇘 "
stashed = "󰏗 "
modified = "󰏫 "
staged = "󰐗 "
renamed = "󰑕 "
deleted = "󰆴 "

[deno]
format = " [deno](italic) [∫ $version](cyan bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold cyan"

[nodejs]
format = " [node](italic) [◫ ($version)](bold bright-cyan)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold bright-cyan)⌊ "
version_format = "${raw}"
style = "bold cyan"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold bright-cyan"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold cyan"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed cyan italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold bright-cyan"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold cyan"
symbol = "▲ "

[buf]
symbol = "■ "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = "ℂ "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = "◯ "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "■ "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
symbol = "◁◅ "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = "△ "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = "◩ "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = "❯λ "
format = " hs [$symbol($version )]($style)"

[java]
symbol = "∪ "
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = "◎ "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = " nim [$symbol($version )]($style)"

[nix_shell]
style = 'bold italic dimmed cyan'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed cyan)'
unknown_msg = '[◌](bold dimmed white)'

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"
