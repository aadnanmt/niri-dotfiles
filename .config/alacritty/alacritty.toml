[window]
padding = { x = 12, y = 12 }
decorations = "None"
opacity = 1.0
blur = false

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[cursor]
style = { shape = "beam", blinking = "Off" }

[colors.primary]
background = "#050505"
foreground = "#c9d1d9"

[colors.cursor]
text = "#0d1117"
cursor = "#58a6ff"

[colors.selection]
text = "#0d1117"
background = "#58a6ff"

[colors.normal]
black   = "#0d1117"
red     = "#f85149"
green   = "#3fb950"
yellow  = "#d29922"
blue    = "#58a6ff"
magenta = "#bc8cff"
cyan    = "#76e3ea"
white   = "#c9d1d9"

[colors.bright]
black   = "#484f58"
red     = "#ffa198"
green   = "#56d364"
yellow  = "#e3b341"
blue    = "#79c0ff"
magenta = "#d2a8ff"
cyan    = "#b3f0ff"
white   = "#f0f6fc"
