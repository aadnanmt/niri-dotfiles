# ─────────────────────────────────────────────────────────────
#  mpv config, tuned for my Thinkpad X270 (Intel HD 620, Kaby Lake)
#  Other GPUs: hwdec=auto-safe pick the best backend automatically
#  Intel-only, uncomment for explicit VA-API:
# hwdec=vaapi
# ─────────────────────────────────────────────────────────────
hwdec=auto-safe

# Client-side maximize via xdg (mpv geometry is broken on my wayland)
window-maximized=yes

# Match niri screenshot dir
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots

# Streaming (yt-dlp)
cache=yes

# 1080p cap, prefer h264 (avc1) so.. HD 620 can hw-decode; fallback any
ytdl-format="best[height<=1080][vcodec^=avc1]/best[height<=1080]/best"
